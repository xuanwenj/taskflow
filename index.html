<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <span class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5" /></svg>
        </span>
        <div>
          <h1>TaskFlow</h1>
          <p class="tagline">A simple task manager for daily work.</p>
        </div>
      </header>

      <section class="summary" aria-label="Task summary">
        <article class="summary-card">
          <span class="summary-icon summary-icon--total" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3" /><path d="M7.5 9h.01M7.5 12.5h.01M7.5 16h.01M11 9h5.5M11 12.5h5.5M11 16h5.5" /></svg>
          </span>
          <div>
            <p class="summary-label">Total Tasks</p>
            <p class="summary-count" id="count-total">0</p>
          </div>
        </article>
        <article class="summary-card">
          <span class="summary-icon summary-icon--progress" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 3.5a8.5 8.5 0 0 1 7.4 4.3" /><path d="M20.5 12a8.5 8.5 0 0 1-4.3 7.4" /><path d="M12 20.5A8.5 8.5 0 0 1 4.6 16.2" /><path d="M3.5 12a8.5 8.5 0 0 1 4.3-7.4" /></svg>
          </span>
          <div>
            <p class="summary-label">In Progress</p>
            <p class="summary-count" id="count-in-progress">0</p>
          </div>
        </article>
        <article class="summary-card">
          <span class="summary-icon summary-icon--completed" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9" /><path d="M8 12.5l3 3 5-6" /></svg>
          </span>
          <div>
            <p class="summary-label">Completed</p>
            <p class="summary-count" id="count-completed">0</p>
          </div>
        </article>
      </section>

      <section class="card add-task" aria-labelledby="add-task-heading">
        <h2 id="add-task-heading">Add New Task</h2>
        <form id="add-task-form" class="add-task-form" novalidate>
          <input id="task-title" class="field field--title" type="text" placeholder="Enter task title..." aria-label="Task title" autocomplete="off" />
          <div class="field field--date">
            <svg class="field-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5" /><path d="M3.5 10h17M8 3v4M16 3v4" /></svg>
            <input id="task-due-date" type="text" placeholder="Due date" aria-label="Due date" />
          </div>
          <div class="field field--status">
            <select id="task-status" aria-label="Status">
              <option value="To Do">To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Completed">Completed</option>
            </select>
            <svg class="field-chevron" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6" /></svg>
          </div>
          <button type="submit" class="btn-primary">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg>
            Add Task
          </button>
        </form>
      </section>

      <div id="feedback" class="feedback" role="status" aria-live="polite" hidden></div>

      <section class="card task-list" aria-labelledby="task-list-heading">
        <h2 id="task-list-heading">Task List</h2>
        <div id="list-state" class="list-state" role="status" aria-live="polite" hidden></div>
        <table class="task-table">
          <thead>
            <tr>
              <th scope="col">Task</th>
              <th scope="col">Status</th>
              <th scope="col">Due Date</th>
              <th scope="col">Actions</th>
            </tr>
          </thead>
          <tbody id="task-rows"></tbody>
        </table>
      </section>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
